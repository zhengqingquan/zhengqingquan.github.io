@startuml
Shape <|- - Circle

Shape <|- - Rectangle

Class Shape {
    + {abstract} void draw();
    + {abstract} double calculateArea();
    + void displayArea();
}

Class Circle {
    - double radius;
    + void draw();
    + double calculateArea();
}

Class Rectangle {
    - double length;
    - double width;
    + void draw();
    + double calculateArea();
}
@enduml

